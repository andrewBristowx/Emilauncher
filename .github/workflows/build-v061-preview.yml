name: Build EmiLauncher 0.6.1 Preview

on:
  push:
    branches:
      - agent/simplified-v0.6.1-hd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Reconstruct HD assets
        run: npm run prepare-assets

      - name: Run regression tests
        run: npm test

      - name: Build portable EXE
        run: npm run dist

      - name: Publish or update preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.1-hd-preview"
          $exe = "dist/EmiLauncher-0.6.1-Windows-x64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --prerelease --target $env:GITHUB_SHA --title "EmiLauncher 0.6.1 HD Preview" --notes "Preview de prueba de EmiLauncher 0.6.1 con la interfaz simplificada HD aprobada."
          }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmiLauncher-0.6.1-Windows
          path: dist/EmiLauncher-0.6.1-Windows-x64.exe
          if-no-files-found: error
